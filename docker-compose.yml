services:
  backend:
    build: .
    container_name: gizra-backend
    restart: always
    ports:
      - "3002:3000"   # 3001 may be in use by other local containers
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/gizra_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_here 
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgis/postgis:16-3.4
    container_name: gizra-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: gizra_db
    ports:
      - "5434:5432"   # 5432 may be in use by other local containers
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgis-init.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gizra-cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: gizra-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"   # 6379 may be in use by other local containers
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
