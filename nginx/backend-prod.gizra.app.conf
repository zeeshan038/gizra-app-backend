# HTTP is only used for Let's Encrypt. certbot --nginx will add the 443 block.
# IMPORTANT: the generated `listen 443 ssl` server block must repeat the same
# proxy_* settings below (especially proxy_buffering off and Upgrade headers)
# or vendor SSE (/api/vendor/orders/events) and Socket.IO will not stream.
server {
    listen 80;
    listen [::]:80;
    server_name backend-prod.gizra.app;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Socket.IO + vendor SSE (/api/vendor/orders/events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
