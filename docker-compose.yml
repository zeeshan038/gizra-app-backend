services:
  backend:
    build: .
    container_name: gizra-backend
    restart: always
    env_file:
      - .env
    ports:
      - "3002:3000"   # 3001 may be in use by other local containers
    environment:
      - PORT=3000
      # Loaded from project .env (Compose substitutes ${DATABASE_URL}). Host MUST be `postgres`, port 5432 — not localhost.
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgis/postgis:16-3.4
    container_name: gizra-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Only applied on first volume init; existing pgdata keeps the original password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: gizra_db
    ports:
      - "5434:5432"   # host tools: localhost:5434
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgis-init.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gizra-cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: gizra-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"   # 6379 may be in use by other local containers
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
