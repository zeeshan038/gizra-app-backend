# HTTP configuration for dev-backend.gizra.app
# After DNS points to server IP (167.233.245.44), run:
# certbot --nginx -d dev-backend.gizra.app
server {
    listen 80;
    listen [::]:80;
    server_name dev-backend.gizra.app backend-dev.gizra.app;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Socket.IO + vendor SSE (/api/vendor/orders/events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
