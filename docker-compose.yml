services:
  backend:
    build: .
    container_name: gizra-backend
    restart: always
    env_file:
      - .env
    ports:
      - "3002:3000"   # 3001 may be in use by other local containers
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env — see env.server.example}
      # Always use the compose Redis service (ignore Mac REDIS_URL=localhost:6380 in .env).
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgis/postgis:16-3.4
    container_name: gizra-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Only applied on first volume init; live password must match DATABASE_URL in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: gizra_db
    ports:
      - "5434:5432"   # host tools: localhost:5434
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgis-init.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gizra_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gizra-cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: gizra-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"   # 6379 may be in use by other local containers
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
